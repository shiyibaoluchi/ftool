name: 构建 ftool

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # 手动触发

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ftool.exe
            artifact_path: src-tauri/target/release/ftool.exe

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ftool.dmg
            artifact_path: src-tauri/target/release/bundle/dmg/ftool_*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 安装 npm 依赖
        run: npm install

      - name: 安装 macOS 系统依赖
        if: runner.os == 'macOS'
        run: |
          brew install gtk+3

      - name: 构建 Tauri 应用
        run: npm run tauri build

      - name: 上传构建产物 (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ftool-windows
          path: ${{ matrix.artifact_path }}

      - name: 上传构建产物 (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ftool-macos
          path: ${{ matrix.artifact_path }}

  # 发布 Release（仅当推送 tag 时触发）
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: 下载 Windows 构建产物
        uses: actions/download-artifact@v4
        with:
          name: ftool-windows

      - name: 下载 macOS 构建产物
        uses: actions/download-artifact@v4
        with:
          name: ftool-macos

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ftool.exe
            *.dmg
          generate_release_notes: true
