name: 构建 ftool

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # 手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm install
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: ftool-windows
          path: src-tauri/target/release/ftool.exe

  build-macos-intel:
    runs-on: macos-13 # Intel 芯片
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm install
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: ftool-macos-intel
          path: src-tauri/target/release/bundle/dmg/ftool_*.dmg

  build-macos-silicon:
    runs-on: macos-latest # Apple Silicon (M1/M2/M3)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm install
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: ftool-macos-silicon
          path: src-tauri/target/release/bundle/dmg/ftool_*.dmg

  # 发布 Release（仅当推送 tag 时触发）
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos-intel, build-macos-silicon]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ftool-windows
      - uses: actions/download-artifact@v4
        with:
          name: ftool-macos-intel
      - uses: actions/download-artifact@v4
        with:
          name: ftool-macos-silicon
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ftool.exe
            *.dmg
          generate_release_notes: true
